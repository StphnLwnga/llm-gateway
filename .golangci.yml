version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
  exclusions:
    rules:
      # Tests use fake DSNs with a password to prove it is redacted.
      - path: _test\.go
        linters:
          - gosec
        text: G101
      # Tests run binaries they have just built from this module.
      - path: _test\.go
        linters:
          - gosec
        text: G204

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
