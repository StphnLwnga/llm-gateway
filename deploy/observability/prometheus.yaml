# Prometheus for local development. The collector pushes metrics over OTLP
  # (--web.enable-otlp-receiver); the only scrape is the collector's own metrics.

  global:
    scrape_interval: 15s

  otlp:
    promote_resource_attributes:
      - deployment.environment.name

  storage:
    tsdb:
      out_of_order_time_window: 30m
      retention:
        time: 7d
    exemplars:
      max_exemplars: 100000

  scrape_configs:
    - job_name: otel-collector
      static_configs:
        - targets: ["otel-collector:8888"]
