# OpenTelemetry Collector for local development. compose.observability.yaml
# mounts it; the gateway and telemetrygen send OTLP/HTTP to port 4318.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  tail_sampling:
    decision_wait: 300s
    decision_wait_after_root_received: 5s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    decision_cache:
      sampled_cache_size: 100000
      non_sampled_cache_size: 100000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 30000
      # A warm local model sends its first chunk in about 0.45 s. Above 1 s
      # means a model load or a queue, which the baseline would mostly drop.
      - name: slow-first-token
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - span.attributes["gen_ai.response.time_to_first_chunk"] > 1.0
      - name: baseline
        type: probabilistic
        probabilistic:
          # 10 normally; TRACE_SAMPLE_PERCENT=100 keeps every trace for experiments.
          sampling_percentage: ${env:TRACE_SAMPLE_PERCENT:-10}
  batch: {}

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
