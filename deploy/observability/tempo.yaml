# Tempo for local development: monolithic mode (-target=all, the default),
# traces on local disk. The collector sends OTLP/HTTP to port 4318.

stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h

memory:
  automemlimit_enabled: true

usage_report:
  reporting_enabled: false