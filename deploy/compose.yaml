# Local use only: the default password below is never for a shared database.

name: llm-gateway

x-gateway-image: &gateway-image
  image: llm-gateway:local
  build:
    context: ..
    dockerfile: deploy/docker/Dockerfile
    args:
      VERSION: ${VERSION:-dev}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
      POSTGRES_DB: gateway
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:-migrator-local}
      APP_PASSWORD: ${APP_PASSWORD:-app-local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-local}
    volumes:
      # Postgres 18 keeps data in /var/lib/postgresql/18/docker. A volume on the
      # old /var/lib/postgresql/data path makes the entrypoint refuse to start.
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: during init a temporary server listens on
      # the socket only, and the socket check would pass too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d gateway"]
      interval: 2s
      timeout: 2s
      retries: 15
    mem_limit: 512m

  migrate:
    <<: *gateway-image
    entrypoint: ["/usr/local/bin/gatewayctl"]
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://gateway_migrator:${MIGRATOR_PASSWORD:-migrator-local}@postgres:5432/gateway?sslmode=disable
      LOG_FORMAT: text
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 64m

  gatewayctl:
    <<: *gateway-image
    entrypoint: ["/usr/local/bin/gatewayctl"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://gateway_admin:${ADMIN_PASSWORD:-admin-local}@postgres:5432/gateway?sslmode=disable
      LOG_FORMAT: text
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 64m

  gateway:
    <<: *gateway-image
    env_file:
      # Provider keys stay out of this file and out of the image (.dockerignore).
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgres://gateway_app:${APP_PASSWORD:-app-local}@postgres:5432/gateway?sslmode=disable
      LOG_FORMAT: text
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DRAIN_DELAY: ${DRAIN_DELAY:-0s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # Linux has no host.docker.internal by default; Docker Desktop does.
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m

  fakeprovider:
    image: llm-gateway-fakeprovider:local
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: fakeprovider
    profiles: ["loadtest"]
    environment:
      PORT: "8081"
    ports:
      - "8081:8081"
    mem_limit: 64m

volumes:
  pgdata:
